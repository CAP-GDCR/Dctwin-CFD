site_name: DCTwin
repo_name: CAP-GDCR/Dctwin-CFD
repo_url: https://github.com/CAP-GDCR/Dctwin-CFD

theme:
  name: material
  palette:
    primary: deep purple
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.annotate
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.instant
    - navigation.expand
    - navigation.indexes
    - navigation.prune
    - toc.follow
    - toc.integrate

plugins:
  - search
  - section-index
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md

nav:
  - Home: index.md
  - Get Started:
      - get_started/index.md
      - Installation: get_started/installation.md
      - CFD Tutorial: get_started/cfd_tutorial.md
      - Case Usage Guide: get_started/case_usage.md
  - Concepts:
      - concepts/index.md
      - Architecture: concepts/architecture.md
      - JSON Schema Reference: concepts/json_schema.md
  - For Developers:
      - for_developers/index.md
      - Development Guide: for_developers/development_guide.md
  - Reference: reference/

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.betterem
  - pymdownx.superfences
  - pymdownx.highlight:
      use_pygments: true
  - toc:
      permalink: true
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - css/code_select.css
