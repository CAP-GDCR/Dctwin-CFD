# Auto-generated by STLGenRunner from cfd_export.json
[paths]
room_json = "model/room.json"
dataset_name = "default"
log_root = "./log"

[geometry]
generate_stl = false
use_stl_geometry = true
force_stl_generation = false
mesh_root = "Mesh"

[mesh]
generate_mesh = true
parallel_mesh = false
