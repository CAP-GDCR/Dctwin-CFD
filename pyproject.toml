[tool.poetry]
name = "dctwin"
version = "3.0.3"

description = "Automated CFD simulation framework for data center thermal analysis."
authors = ["Ruihang Wang", "Zhiwei Cao"]
license = "Apache-2.0"
readme = "README.md"
packages = [
    {include = "dctwin", from = "src"},
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
jinja2 = "^3.1.2"
markupsafe = "^2.0.1"
setuptools = ">=59.8.0"
numpy = "<2.0.0"
scipy = "^1.10.1"
pydantic = "^2.0.0"
loguru = "^0.7.2"
toml = "^0.10.2"
sh = "^2.0.6"
psutil = "5.9.8"
vtk = "9.5.1"
pyvista = "^0.47.1"
tqdm = "^4.64.1"
requests = ">2.32"
reportlab = "^4.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.2.0"
isort = "^5.10.1"
black = "^24.3.0"
mkdocs = "^1.4.2"
mkdocstrings = "^0.19.0"
mkdocs-autorefs = "^0.4.1"
mkdocs-gen-files = "^0.4.0"
mkdocs-literate-nav = "^0.5.0"
mkdocs-material = "^9.5.5"
mkdocs-material-extensions = "^1.1"
mkdocs-section-index = "^0.3.4"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
